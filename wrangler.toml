name = "spaceship-scout"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# The SPA build output. Assets are matched first; anything with no matching
# file falls through to the Worker, which takes /api/* and hands everything
# else back to the asset router. not_found_handling only applies through the
# binding — it is NOT applied automatically when `main` is set, so without the
# explicit fallback in worker/index.ts a deep link 404s.
# The shell is served to anyone; the API behind it requires a session. The
# bundle carries no metric definitions or thresholds — those stay in the
# Worker — so there is nothing in it to protect, and this is what lets the
# login form be a page in the app rather than a browser dialog.
assets = { directory = "dist", binding = "ASSETS", not_found_handling = "single-page-application" }

# Cloudflare's CI runs `npx wrangler deploy` directly rather than an npm
# script, so the build has to hang off wrangler itself. Without this, dist/
# does not exist at deploy time and the assets directory check fails.
[build]
command = "npm run build"

[[d1_databases]]
binding = "DB"
database_name = "spaceship-intel-db"
database_id = "dc95c5f2-8b04-4704-9c22-f04dad48d49a"

# OPENROUTER_API_KEY is a secret, never a var:
#   wrangler secret put OPENROUTER_API_KEY
[vars]
OPENROUTER_MODEL = "google/gemini-3.8-flash"
