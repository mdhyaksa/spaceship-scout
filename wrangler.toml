name = "spaceship-logistics"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# The SPA build output. Assets are matched first; anything with no matching
# file falls through to the Worker, which takes /api/* and hands everything
# else back to the asset router. not_found_handling only applies through the
# binding — it is NOT applied automatically when `main` is set, so without the
# explicit fallback in worker/index.ts a deep link 404s.
assets = { directory = "dist", binding = "ASSETS", not_found_handling = "single-page-application" }

[[d1_databases]]
binding = "DB"
database_name = "logistics"
database_id = "REPLACE_AFTER_wrangler_d1_create"

# OPENROUTER_API_KEY is a secret, never a var:
#   wrangler secret put OPENROUTER_API_KEY
[vars]
OPENROUTER_MODEL = "anthropic/claude-sonnet-4.5"
